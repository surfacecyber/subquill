# Source-only distribution: tags create GitHub releases with source archives only.
# No installer artifacts (DMG/NSIS/EXE) or updater payloads are published.
name: Release

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check-version:
    name: Verify versions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version: lts/*
          cache: npm

      - run: npm ci

      - name: Check project and tag versions
        run: node scripts/check-versions.mjs --tag "${{ github.ref_name }}"
